# Config mínima do Grafana Tempo — recebe traces via OTLP, armazena em disco local.
# Esboço para o stretch de observabilidade; não coberto por SLA/retenção de produção.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
