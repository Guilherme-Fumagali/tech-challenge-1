asyncapi: 2.6.0
info:
  title: OS Service — mensagens da saga da ordem de serviço
  version: 1.0.0
  description: 'Comandos publicados pelo orquestrador da saga (OS Service) e eventos que ele consome. Contrato definido na
    SPEC-08: envelope comum em JSON UTF-8 no corpo da mensagem SQS, atributos `tipo` e `versao` do tipo String, envio por
    Transactional Outbox e consumo idempotente por `mensagemId`.'
defaultContentType: application/json
servers:
  aws:
    url: sqs.us-east-1.amazonaws.com
    protocol: sqs
    description: Filas padrão com SSE-SQS e DLQ (`-dlq`, maxReceiveCount 5), uma por ambiente (staging, prod).
  local:
    url: localhost:4566
    protocol: sqs
    description: LocalStack do docker-compose; filas criadas por localstack/init/ready.d/criar-filas.sh.
channels:
  oficina-{ambiente}-os-eventos:
    description: 'Fila de entrada do OS Service: respostas e eventos do Billing e do Execution. Consumida por ConsumidorEventosOs
      com reconhecimento ON_SUCCESS, até 5 mensagens simultâneas.'
    parameters:
      ambiente:
        $ref: '#/components/parameters/ambiente'
    publish:
      operationId: receberEventoDaSaga
      summary: Billing e Execution publicam; o OS Service consome e aplica na saga.
      message:
        oneOf:
        - $ref: '#/components/messages/ExecucaoEnfileirada'
        - $ref: '#/components/messages/DiagnosticoIniciado'
        - $ref: '#/components/messages/DiagnosticoConcluido'
        - $ref: '#/components/messages/ReparoIniciado'
        - $ref: '#/components/messages/ExecucaoFinalizada'
        - $ref: '#/components/messages/ExecucaoFalhou'
        - $ref: '#/components/messages/ExecucaoCancelada'
        - $ref: '#/components/messages/OrcamentoGerado'
        - $ref: '#/components/messages/OrcamentoAprovado'
        - $ref: '#/components/messages/OrcamentoReprovado'
        - $ref: '#/components/messages/OrcamentoExpirado'
        - $ref: '#/components/messages/OrcamentoCancelado'
        - $ref: '#/components/messages/PagamentoAprovado'
        - $ref: '#/components/messages/PagamentoRecusado'
        - $ref: '#/components/messages/PagamentoEstornado'
        - $ref: '#/components/messages/ComandoRejeitado'
  oficina-{ambiente}-execution-comandos:
    description: Fila de comandos do Execution Service.
    parameters:
      ambiente:
        $ref: '#/components/parameters/ambiente'
    subscribe:
      operationId: enviarComandoAoExecution
      summary: O OS Service publica pelo relay do outbox; o Execution consome.
      message:
        oneOf:
        - $ref: '#/components/messages/IniciarDiagnostico'
        - $ref: '#/components/messages/ReabrirDiagnostico'
        - $ref: '#/components/messages/IniciarReparo'
        - $ref: '#/components/messages/CancelarExecucao'
  oficina-{ambiente}-billing-comandos:
    description: Fila de comandos do Billing Service.
    parameters:
      ambiente:
        $ref: '#/components/parameters/ambiente'
    subscribe:
      operationId: enviarComandoAoBilling
      summary: O OS Service publica pelo relay do outbox; o Billing consome.
      message:
        oneOf:
        - $ref: '#/components/messages/GerarOrcamento'
        - $ref: '#/components/messages/CancelarOrcamento'
        - $ref: '#/components/messages/EstornarPagamento'
components:
  schemas:
    Envelope:
      type: object
      required:
      - mensagemId
      - tipo
      - versao
      - sagaId
      - osId
      - causadaPor
      - origem
      - ocorridoEm
      - dados
      properties:
        mensagemId:
          type: string
          format: uuid
          description: Novo a cada envio; reenvio por prazo vencido gera outro.
        tipo:
          type: string
          description: Nome do catálogo da SPEC-08, em PascalCase.
        versao:
          type: integer
          minimum: 1
        sagaId:
          type: string
          format: uuid
          description: Id da saga no OS Service; copiado pelos participantes.
        osId:
          type: string
          format: uuid
          description: Chave de negócio em todos os serviços.
        causadaPor:
          type:
          - string
          - 'null'
          format: uuid
          description: mensagemId que originou a mensagem; nulo em ação de pessoa.
        origem:
          type: string
          enum:
          - os-service
          - billing-service
          - execution-service
        ocorridoEm:
          type: string
          format: date-time
          description: Instante UTC com sufixo Z.
        dados:
          type: object
    DadosIniciarDiagnostico:
      type: object
      required:
      - clienteId
      - veiculo
      - abertaEm
      properties:
        clienteId:
          type: string
          format: uuid
        veiculo:
          type: object
          required:
          - placa
          - marca
          - modelo
          - anoFabricacao
          properties:
            placa:
              type: string
            marca:
              type: string
            modelo:
              type: string
            anoFabricacao:
              type: integer
        abertaEm:
          type: string
          format: date-time
    DadosReabrirDiagnostico:
      type: object
      required:
      - motivo
      properties:
        motivo:
          type: string
    DadosIniciarReparo:
      type: object
      required:
      - itens
      properties:
        itens:
          type: array
          items:
            type: object
            required:
            - tipo
            - descricao
            - quantidade
            properties:
              tipo:
                type: string
                enum:
                - SERVICO
                - PECA
              descricao:
                type: string
              quantidade:
                type: integer
                minimum: 1
    DadosCancelarExecucao:
      type: object
      required:
      - motivo
      properties:
        motivo:
          type: string
    DadosGerarOrcamento:
      type: object
      required:
      - clienteId
      - cliente
      - veiculo
      - itens
      properties:
        clienteId:
          type: string
          format: uuid
        cliente:
          type: object
          required:
          - nome
          - email
          properties:
            nome:
              type: string
            email:
              type: string
        veiculo:
          type: object
          required:
          - placa
          - modelo
          properties:
            placa:
              type: string
            modelo:
              type: string
        itens:
          type: array
          items:
            type: object
            required:
            - tipo
            - referenciaId
            - descricao
            - quantidade
            - precoUnitario
            properties:
              tipo:
                type: string
                enum:
                - SERVICO
                - PECA
              referenciaId:
                type: string
                format: uuid
              descricao:
                type: string
              quantidade:
                type: integer
                minimum: 1
              precoUnitario:
                type: number
                multipleOf: 0.01
    DadosCancelarOrcamento:
      type: object
      required:
      - motivo
      properties:
        motivo:
          type: string
    DadosEstornarPagamento:
      type: object
      required:
      - motivo
      properties:
        motivo:
          type: string
    DadosExecucaoEnfileirada:
      type: object
      required:
      - etapa
      - enfileiradaEm
      properties:
        etapa:
          type: string
          enum:
          - DIAGNOSTICO
          - REPARO
        enfileiradaEm:
          type: string
          format: date-time
    DadosDiagnosticoIniciado:
      type: object
      required:
      - mecanicoId
      - iniciadoEm
      properties:
        mecanicoId:
          type: string
          format: uuid
        iniciadoEm:
          type: string
          format: date-time
    DadosDiagnosticoConcluido:
      type: object
      required:
      - mecanicoId
      - concluidoEm
      properties:
        mecanicoId:
          type: string
          format: uuid
        concluidoEm:
          type: string
          format: date-time
        observacoes:
          type: string
    DadosReparoIniciado:
      type: object
      required:
      - mecanicoId
      - iniciadoEm
      properties:
        mecanicoId:
          type: string
          format: uuid
        iniciadoEm:
          type: string
          format: date-time
    DadosExecucaoFinalizada:
      type: object
      required:
      - mecanicoId
      - finalizadaEm
      properties:
        mecanicoId:
          type: string
          format: uuid
        finalizadaEm:
          type: string
          format: date-time
    DadosExecucaoFalhou:
      type: object
      required:
      - mecanicoId
      - motivo
      - ocorridaEm
      properties:
        mecanicoId:
          type: string
          format: uuid
        motivo:
          type: string
        ocorridaEm:
          type: string
          format: date-time
    DadosExecucaoCancelada:
      type: object
      required:
      - canceladaEm
      properties:
        motivo:
          type: string
        canceladaEm:
          type: string
          format: date-time
    DadosOrcamentoGerado:
      type: object
      required:
      - orcamentoId
      - total
      - validoAte
      properties:
        orcamentoId:
          type: string
          format: uuid
        total:
          type: number
          multipleOf: 0.01
        validoAte:
          type: string
          format: date-time
    DadosOrcamentoAprovado:
      type: object
      required:
      - orcamentoId
      - aprovadoEm
      - canal
      properties:
        orcamentoId:
          type: string
          format: uuid
        aprovadoEm:
          type: string
          format: date-time
        canal:
          type: string
          enum:
          - CLIENTE
          - LINK
          - BALCAO
        linkPagamento:
          type: string
    DadosOrcamentoReprovado:
      type: object
      required:
      - orcamentoId
      - reprovadoEm
      - canal
      properties:
        orcamentoId:
          type: string
          format: uuid
        reprovadoEm:
          type: string
          format: date-time
        canal:
          type: string
          enum:
          - CLIENTE
          - LINK
          - BALCAO
    DadosOrcamentoExpirado:
      type: object
      required:
      - orcamentoId
      - expiradoEm
      properties:
        orcamentoId:
          type: string
          format: uuid
        expiradoEm:
          type: string
          format: date-time
    DadosOrcamentoCancelado:
      type: object
      required:
      - motivo
      properties:
        orcamentoId:
          type:
          - string
          - 'null'
          format: uuid
        motivo:
          type: string
    DadosPagamentoAprovado:
      type: object
      required:
      - orcamentoId
      - pagamentoId
      - valor
      - aprovadoEm
      properties:
        orcamentoId:
          type: string
          format: uuid
        pagamentoId:
          type: string
          format: uuid
        valor:
          type: number
          multipleOf: 0.01
        aprovadoEm:
          type: string
          format: date-time
        meio:
          type: string
    DadosPagamentoRecusado:
      type: object
      required:
      - orcamentoId
      - motivo
      properties:
        orcamentoId:
          type: string
          format: uuid
        pagamentoId:
          type:
          - string
          - 'null'
          format: uuid
        motivo:
          type: string
    DadosPagamentoEstornado:
      type: object
      required:
      - valor
      - estornadoEm
      properties:
        orcamentoId:
          type:
          - string
          - 'null'
          format: uuid
        pagamentoId:
          type:
          - string
          - 'null'
          format: uuid
        valor:
          type: number
          multipleOf: 0.01
        estornadoEm:
          type: string
          format: date-time
    DadosComandoRejeitado:
      type: object
      required:
      - comando
      - motivo
      - codigo
      properties:
        comando:
          type: string
        motivo:
          type: string
        codigo:
          type: string
          enum:
          - DADOS_INVALIDOS
          - ORCAMENTO_NAO_ENCONTRADO
          - EXECUCAO_INEXISTENTE
          - ESTADO_INVALIDO
          - COMANDO_DESCONHECIDO
  messages:
    IniciarDiagnostico:
      name: IniciarDiagnostico
      title: IniciarDiagnostico
      summary: Pede ao Execution que coloque a OS na fila de diagnóstico.
      description: 'Quando é enviado: Enviado na abertura da OS, na mesma transação que cria a saga. Exige resposta ExecucaoEnfileirada{DIAGNOSTICO};
        sem resposta no prazo, é reenviado com novo mensagemId.'
      traits:
      - $ref: '#/components/messageTraits/atributosSqs'
      payload:
        allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            tipo:
              type: string
              enum:
              - IniciarDiagnostico
            dados:
              $ref: '#/components/schemas/DadosIniciarDiagnostico'
      examples:
      - name: IniciarDiagnostico
        headers:
          tipo: IniciarDiagnostico
          versao: '1'
        payload:
          mensagemId: 0d6f6f0e-8b0a-4d39-9a4e-9c8a5f3a1b11
          tipo: IniciarDiagnostico
          versao: 1
          sagaId: 7f1c2e0a-1d5b-4c7e-8a51-3f0e2a9b6c44
          osId: c3a1d8a2-5e8f-4b3a-9d1c-2b7e6f4a9e10
          causadaPor: null
          origem: os-service
          ocorridoEm: '2026-10-30T14:05:11.482Z'
          dados:
            clienteId: 0b9a3c7e-6d2f-4e41-9a8b-5c1d2e3f4a5b
            veiculo:
              placa: ABC1D23
              marca: Volkswagen
              modelo: Polo
              anoFabricacao: 2021
            abertaEm: '2026-10-30T14:05:11.482Z'
    ReabrirDiagnostico:
      name: ReabrirDiagnostico
      title: ReabrirDiagnostico
      summary: Devolve a execução ao diagnóstico.
      description: 'Quando é enviado: Enviado quando DiagnosticoConcluido chega e a OS não tem serviço nem peça. Não exige
        resposta.'
      traits:
      - $ref: '#/components/messageTraits/atributosSqs'
      payload:
        allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            tipo:
              type: string
              enum:
              - ReabrirDiagnostico
            dados:
              $ref: '#/components/schemas/DadosReabrirDiagnostico'
      examples:
      - name: ReabrirDiagnostico
        headers:
          tipo: ReabrirDiagnostico
          versao: '1'
        payload:
          mensagemId: 0d6f6f0e-8b0a-4d39-9a4e-9c8a5f3a1b11
          tipo: ReabrirDiagnostico
          versao: 1
          sagaId: 7f1c2e0a-1d5b-4c7e-8a51-3f0e2a9b6c44
          osId: c3a1d8a2-5e8f-4b3a-9d1c-2b7e6f4a9e10
          causadaPor: 6b1f0a2e-3c4d-4e5f-8a9b-0c1d2e3f4a5b
          origem: os-service
          ocorridoEm: '2026-10-30T14:05:11.482Z'
          dados:
            motivo: Diagnóstico concluído sem serviços ou peças na ordem de serviço.
    IniciarReparo:
      name: IniciarReparo
      title: IniciarReparo
      summary: Pede ao Execution que coloque a OS na fila de reparo.
      description: 'Quando é enviado: Enviado após PagamentoAprovado. Exige resposta ExecucaoEnfileirada{REPARO}.'
      traits:
      - $ref: '#/components/messageTraits/atributosSqs'
      payload:
        allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            tipo:
              type: string
              enum:
              - IniciarReparo
            dados:
              $ref: '#/components/schemas/DadosIniciarReparo'
      examples:
      - name: IniciarReparo
        headers:
          tipo: IniciarReparo
          versao: '1'
        payload:
          mensagemId: 0d6f6f0e-8b0a-4d39-9a4e-9c8a5f3a1b11
          tipo: IniciarReparo
          versao: 1
          sagaId: 7f1c2e0a-1d5b-4c7e-8a51-3f0e2a9b6c44
          osId: c3a1d8a2-5e8f-4b3a-9d1c-2b7e6f4a9e10
          causadaPor: 6b1f0a2e-3c4d-4e5f-8a9b-0c1d2e3f4a5b
          origem: os-service
          ocorridoEm: '2026-10-30T14:05:11.482Z'
          dados:
            itens:
            - tipo: SERVICO
              descricao: Troca de pastilhas
              quantidade: 1
            - tipo: PECA
              descricao: Pastilha de freio
              quantidade: 2
    CancelarExecucao:
      name: CancelarExecucao
      title: CancelarExecucao
      summary: 'Compensação: cancela a execução da OS.'
      description: 'Quando é enviado: Primeira compensação de REPROVACAO e REJEICAO e segunda de PAGAMENTO_RECUSADO. A resposta
        ExecucaoCancelada libera a próxima compensação.'
      traits:
      - $ref: '#/components/messageTraits/atributosSqs'
      payload:
        allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            tipo:
              type: string
              enum:
              - CancelarExecucao
            dados:
              $ref: '#/components/schemas/DadosCancelarExecucao'
      examples:
      - name: CancelarExecucao
        headers:
          tipo: CancelarExecucao
          versao: '1'
        payload:
          mensagemId: 0d6f6f0e-8b0a-4d39-9a4e-9c8a5f3a1b11
          tipo: CancelarExecucao
          versao: 1
          sagaId: 7f1c2e0a-1d5b-4c7e-8a51-3f0e2a9b6c44
          osId: c3a1d8a2-5e8f-4b3a-9d1c-2b7e6f4a9e10
          causadaPor: 6b1f0a2e-3c4d-4e5f-8a9b-0c1d2e3f4a5b
          origem: os-service
          ocorridoEm: '2026-10-30T14:05:11.482Z'
          dados:
            motivo: REPROVACAO
    GerarOrcamento:
      name: GerarOrcamento
      title: GerarOrcamento
      summary: Pede ao Billing o orçamento a partir do snapshot dos itens da OS.
      description: 'Quando é enviado: Enviado quando DiagnosticoConcluido chega e a OS tem itens. Exige resposta OrcamentoGerado
        ou ComandoRejeitado.'
      traits:
      - $ref: '#/components/messageTraits/atributosSqs'
      payload:
        allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            tipo:
              type: string
              enum:
              - GerarOrcamento
            dados:
              $ref: '#/components/schemas/DadosGerarOrcamento'
      examples:
      - name: GerarOrcamento
        headers:
          tipo: GerarOrcamento
          versao: '1'
        payload:
          mensagemId: 0d6f6f0e-8b0a-4d39-9a4e-9c8a5f3a1b11
          tipo: GerarOrcamento
          versao: 1
          sagaId: 7f1c2e0a-1d5b-4c7e-8a51-3f0e2a9b6c44
          osId: c3a1d8a2-5e8f-4b3a-9d1c-2b7e6f4a9e10
          causadaPor: 6b1f0a2e-3c4d-4e5f-8a9b-0c1d2e3f4a5b
          origem: os-service
          ocorridoEm: '2026-10-30T14:05:11.482Z'
          dados:
            clienteId: 0b9a3c7e-6d2f-4e41-9a8b-5c1d2e3f4a5b
            cliente:
              nome: Maria Souza
              email: cliente@example.com
            veiculo:
              placa: ABC1D23
              modelo: Polo
            itens:
            - tipo: SERVICO
              referenciaId: 9f8e7d6c-5b4a-4321-8fed-cba987654321
              descricao: Troca de pastilhas
              quantidade: 1
              precoUnitario: 120.0
            - tipo: PECA
              referenciaId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              descricao: Pastilha de freio
              quantidade: 2
              precoUnitario: 120.0
    CancelarOrcamento:
      name: CancelarOrcamento
      title: CancelarOrcamento
      summary: 'Compensação: cancela o orçamento da OS.'
      description: 'Quando é enviado: Primeira compensação de PAGAMENTO_RECUSADO e segunda de FALHA_EXECUCAO. A resposta OrcamentoCancelado
        libera a próxima compensação.'
      traits:
      - $ref: '#/components/messageTraits/atributosSqs'
      payload:
        allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            tipo:
              type: string
              enum:
              - CancelarOrcamento
            dados:
              $ref: '#/components/schemas/DadosCancelarOrcamento'
      examples:
      - name: CancelarOrcamento
        headers:
          tipo: CancelarOrcamento
          versao: '1'
        payload:
          mensagemId: 0d6f6f0e-8b0a-4d39-9a4e-9c8a5f3a1b11
          tipo: CancelarOrcamento
          versao: 1
          sagaId: 7f1c2e0a-1d5b-4c7e-8a51-3f0e2a9b6c44
          osId: c3a1d8a2-5e8f-4b3a-9d1c-2b7e6f4a9e10
          causadaPor: 6b1f0a2e-3c4d-4e5f-8a9b-0c1d2e3f4a5b
          origem: os-service
          ocorridoEm: '2026-10-30T14:05:11.482Z'
          dados:
            motivo: PAGAMENTO_RECUSADO
    EstornarPagamento:
      name: EstornarPagamento
      title: EstornarPagamento
      summary: 'Compensação: estorna o pagamento aprovado.'
      description: 'Quando é enviado: Primeira compensação de FALHA_EXECUCAO. A resposta PagamentoEstornado libera a próxima
        compensação.'
      traits:
      - $ref: '#/components/messageTraits/atributosSqs'
      payload:
        allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            tipo:
              type: string
              enum:
              - EstornarPagamento
            dados:
              $ref: '#/components/schemas/DadosEstornarPagamento'
      examples:
      - name: EstornarPagamento
        headers:
          tipo: EstornarPagamento
          versao: '1'
        payload:
          mensagemId: 0d6f6f0e-8b0a-4d39-9a4e-9c8a5f3a1b11
          tipo: EstornarPagamento
          versao: 1
          sagaId: 7f1c2e0a-1d5b-4c7e-8a51-3f0e2a9b6c44
          osId: c3a1d8a2-5e8f-4b3a-9d1c-2b7e6f4a9e10
          causadaPor: 6b1f0a2e-3c4d-4e5f-8a9b-0c1d2e3f4a5b
          origem: os-service
          ocorridoEm: '2026-10-30T14:05:11.482Z'
          dados:
            motivo: FALHA_EXECUCAO
    ExecucaoEnfileirada:
      name: ExecucaoEnfileirada
