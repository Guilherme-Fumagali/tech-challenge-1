spring:
  application:
    name: oficina-mecanica-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USER:oficina}
    password: ${DB_PASS:oficina}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:minha-chave-super-secreta-para-desenvolvimento-local-32chars}
  access-expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  admin:
    password: ${ADMIN_PASSWORD:admin123}
  aprovacao-externa:
    validade-horas: ${APROVACAO_TOKEN_VALIDADE_HORAS:168}
  notificacao:
    canal: ${NOTIFICACAO_CANAL:log}
  mail:
    from: ${MAIL_FROM:oficina@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  # Observabilidade (OpenTelemetry) — diferencial opcional. Sem OTEL_EXPORTER_OTLP_ENDPOINT
  # configurado, o exporter tenta localhost:4317 e falha silenciosamente (não derruba a app).
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

logging:
  level:
    com.oficina: INFO
    org.springframework.security: WARN
