spring:
  application:
    name: oficina-mecanica-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USER:oficina}
    password: ${DB_PASS:oficina}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        queue-not-found-strategy: fail
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      funcionario-seed-cpf: ${FUNCIONARIO_SEED_CPF:}
      funcionario-seed-nome: ${FUNCIONARIO_SEED_NOME:}

server:
  port: ${PORT:8080}
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:minha-chave-super-secreta-para-desenvolvimento-local-32chars}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  mensageria:
    origem: os-service
    filas:
      os-eventos: ${FILA_OS_EVENTOS:oficina-local-os-eventos}
      billing-comandos: ${FILA_BILLING_COMANDOS:oficina-local-billing-comandos}
      execution-comandos: ${FILA_EXECUTION_COMANDOS:oficina-local-execution-comandos}
      entrada: ${app.mensageria.filas.os-eventos}
    dlq: ${FILA_DLQ:${app.mensageria.filas.os-eventos}-dlq}
    relay:
      intervalo: 500
      lote: 50
    dlq-intervalo: 60000
  saga:
    prazo-resposta: PT2M
    verificacao-prazos: 30000
    max-reenvios: 3
    lote: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:60s}
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
        resource-attributes:
          service.name: ${spring.application.name}
          service.environment: ${ENV:local}
          env: ${ENV:local}

logging:
  level:
    root: INFO
    com.oficina: INFO
    org.springframework.security: WARN
