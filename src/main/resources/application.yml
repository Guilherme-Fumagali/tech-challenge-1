spring:
  application:
    name: os-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USER:oficina}
    password: ${DB_PASS:oficina}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        queue-not-found-strategy: fail
  task:
    scheduling:
      pool:
        size: 3
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      funcionario-seed-cpf: ${FUNCIONARIO_SEED_CPF:}
      funcionario-seed-nome: ${FUNCIONARIO_SEED_NOME:}
      funcionario-seed-email: ${FUNCIONARIO_SEED_EMAIL:}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  seguranca:
    chave-interna: ${CHAVE_INTERNA:}
  mensageria:
    origem: os-service
    filas:
      os-eventos: ${FILA_OS_EVENTOS:oficina-local-os-eventos}
      billing-comandos: ${FILA_BILLING_COMANDOS:oficina-local-billing-comandos}
      execution-comandos: ${FILA_EXECUTION_COMANDOS:oficina-local-execution-comandos}
      entrada: ${app.mensageria.filas.os-eventos}
    dlq: ${FILA_DLQ:${app.mensageria.filas.os-eventos}-dlq}
    relay:
      intervalo: 500
      lote: 50
    dlq-intervalo: 60000
  saga:
    prazo-resposta: PT2M
    verificacao-prazos: 30000
    max-reenvios: 3
    lote: 20
  integracoes:
    billing:
      url: ${BILLING_URL:http://localhost:8081}
    execution:
      url: ${EXECUTION_URL:http://localhost:8082}
    timeout-conexao: 1s
    timeout-leitura: 3s

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
        cancel-running-future: true
    instances:
      billing:
        base-config: default
      execution:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      billing:
        base-config: default
      execution:
        base-config: default
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 10
        max-wait-duration: 0
    instances:
      billing:
        base-config: default
      execution:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    git:
      mode: simple
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:60s}
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
        resource-attributes:
          service.name: ${spring.application.name}
          service.environment: ${ENV:local}
          env: ${ENV:local}

logging:
  level:
    root: INFO
    com.oficina: INFO
    org.springframework.security: WARN
