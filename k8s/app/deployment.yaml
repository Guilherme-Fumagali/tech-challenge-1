apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
spec:
  # Sem replicas: o HPA (hpa.yaml) gerencia a contagem.
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: oficina-api
          image: ghcr.io/guilherme-fumagali/oficina-api:latest
          # Explícito de propósito. Sem isto, o Kubernetes deriva a política da tag: como a
          # imagem acima é ":latest", ele grava Always — e Always continua valendo mesmo depois
          # que o Terraform ou o CD trocam a imagem por outra tag. No kind isso quebra o deploy
          # (a imagem está no nó, mas o kubelet tenta puxar do registry assim mesmo). O CD faz
          # deploy por tag imutável (o SHA do commit), então IfNotPresent puxa quando é nova.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
