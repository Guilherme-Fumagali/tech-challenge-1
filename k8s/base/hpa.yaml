apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: os-service
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/part-of: oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: os-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
