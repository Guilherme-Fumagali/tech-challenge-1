apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/part-of: oficina
data:
  SPRING_PROFILES_ACTIVE: k8s
  PORT: "8080"
  ENV: staging
  NEW_RELIC_APP_NAME: oficina-os-service-staging
  NEW_RELIC_LOG_FILE_NAME: STDOUT
  NEW_RELIC_LABELS: "fase:tech-challenge-4;servico:os-service"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_CONTEXT_DATA_ENABLED: "true"
  AWS_REGION: us-east-1
  FILA_OS_EVENTOS: oficina-staging-os-eventos
  FILA_BILLING_COMANDOS: oficina-staging-billing-comandos
  FILA_EXECUTION_COMANDOS: oficina-staging-execution-comandos
  FILA_DLQ: oficina-staging-os-eventos-dlq
  BILLING_URL: http://billing-service.oficina.svc.cluster.local
  EXECUTION_URL: http://execution-service.oficina.svc.cluster.local
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: https://otlp.nr-data.net/v1/metrics
  METRICS_EXPORT_STEP: 60s
