name: Terraform

# Plan roda automático; apply exige aprovação (environment aws-production). Ver infra/README.md.
on:
  push:
    branches: [main]
    paths:
      - "infra/environments/aws/**"
      - "k8s/app/**"
      - "k8s/metrics-server/**"
      - "k8s/namespace.yaml"
      - "k8s/mailhog/**"
  workflow_dispatch:

jobs:
  bootstrap:
    name: Bootstrap (backend de state)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - run: |
          chmod +x infra/bootstrap/bootstrap.sh
          infra/bootstrap/bootstrap.sh create

  plan-aws:
    name: Plan (aws)
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/environments/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init
      - run: terraform validate
      - name: Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
          TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
        run: terraform plan -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-aws
          path: infra/environments/aws/tfplan
          retention-days: 1

  apply-aws:
    name: Apply (aws) — requer aprovação
    needs: plan-aws
    runs-on: ubuntu-latest
    environment: aws-production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/environments/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-aws
          path: infra/environments/aws

      - run: terraform apply -auto-approve tfplan
