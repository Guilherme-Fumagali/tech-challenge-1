name: Terraform

# Manual. Infra AWS é cobrada. Ver infra/README.md.
on:
  workflow_dispatch:

jobs:
  plan-aws:
    name: Plan (aws)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/environments/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init
      - run: terraform validate
      - name: Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
          TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
        run: terraform plan -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-aws
          path: infra/environments/aws/tfplan
          retention-days: 1

  apply-aws:
    name: Apply (aws) — requer aprovação
    needs: plan-aws
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws-production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/environments/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-aws
          path: infra/environments/aws

      - run: terraform apply -auto-approve tfplan
