name: Destroy AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy-aws:
    name: Destroy (aws)
    runs-on: ubuntu-latest
    environment: aws-production
    defaults:
      run:
        working-directory: infra/environments/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init

      - name: Remover Service LoadBalancer (o finalizer aguarda o ELB sumir antes de seguir)
        working-directory: ${{ github.workspace }}
        run: |
          if aws eks update-kubeconfig --name oficina-api-aws --region us-east-1 2>/dev/null; then
            kubectl delete svc oficina-api -n oficina --ignore-not-found --wait=true --timeout=180s
          else
            echo "Cluster nao existe — nada a remover."
          fi

      - name: Destroy
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
          TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
        run: terraform destroy -auto-approve

      - name: Remover backend de state
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x infra/bootstrap/bootstrap.sh
          infra/bootstrap/bootstrap.sh destroy
