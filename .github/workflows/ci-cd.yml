name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-analyze:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify sonar:sonar

  build-and-push-image:
    name: Build & push imagem
    needs: build-and-analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nome de imagem em minúsculas (exigência do GHCR)
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/oficina-api:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/oficina-api:latest

  deploy-app:
    name: Deploy no EKS
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: aws-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Aguardar cluster ACTIVE
        run: aws eks wait cluster-active --name oficina-api-aws --region us-east-1

      - name: Configurar kubeconfig
        run: aws eks update-kubeconfig --name oficina-api-aws --region us-east-1

      - run: kubectl apply -f k8s/namespace.yaml -f k8s/app/

      - name: Atualizar imagem e aguardar rollout
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          kubectl set image deployment/oficina-api oficina-api=ghcr.io/${OWNER_LC}/oficina-api:${{ needs.build-and-push-image.outputs.image_tag }} -n oficina
          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s
