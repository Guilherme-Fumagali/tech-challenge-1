name: Bootstrap AWS

# Backend de state (S3 + DynamoDB), pré-requisito fora do Terraform. Ver infra/README.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "create = provisiona o backend | destroy = remove (rode DEPOIS de 'Destroy AWS')"
        required: true
        type: choice
        default: create
        options: [create, destroy]

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: "Backend de state — ${{ inputs.action }}"
    runs-on: ubuntu-latest
    environment: aws-production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Executar bootstrap
        run: |
          chmod +x infra/bootstrap/bootstrap.sh
          infra/bootstrap/bootstrap.sh "${{ inputs.action }}"
