name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Calcular nome de imagem em minúsculas (exigência do GHCR)
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/oficina-api:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/oficina-api:latest

  deploy-app:
    name: Deploy no EKS
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      id-token: write # obrigatório pro configure-aws-credentials assumir a role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configurar kubeconfig
        # Dinâmico via update-kubeconfig — sem secret KUBE_CONFIG base64 estático pra rotacionar.
        # Só funciona se infra/environments/aws já tiver sido aplicado (workflow terraform.yml)
        # ao menos uma vez antes — sequenciamento manual, documentado em infra/README.md
        # (GitHub Actions não tem `needs:` nativo entre arquivos de workflow diferentes).
        run: aws eks update-kubeconfig --name oficina-api-aws --region us-east-1

      - run: kubectl apply -f k8s/namespace.yaml -f k8s/app/

      - name: Atualizar imagem e aguardar rollout
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          kubectl set image deployment/oficina-api oficina-api=ghcr.io/${OWNER_LC}/oficina-api:${{ needs.build-and-push-image.outputs.image_tag }} -n oficina
          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s
