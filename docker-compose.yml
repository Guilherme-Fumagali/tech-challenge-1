services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: ${DB_USER:-oficina}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oficina}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oficina-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: oficina-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web
    networks:
      - oficina-net

  api:
    build: .
    container_name: oficina-api
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/oficina
      DB_USER: ${DB_USER:-oficina}
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: 8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      NOTIFICACAO_CANAL: ${NOTIFICACAO_CANAL:-smtp}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-oficina@example.com}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - oficina-net

networks:
  oficina-net:

volumes:
  pgdata:
