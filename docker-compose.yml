services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: ${DB_USER:-oficina}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oficina}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oficina-net

  localstack:
    image: localstack/localstack:3
    container_name: oficina-localstack
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": *true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - oficina-net

  api:
    build: .
    container_name: oficina-api
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/oficina
      DB_USER: ${DB_USER:-oficina}
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CHAVE_INTERNA: ${CHAVE_INTERNA:-chave-interna-local}
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      BILLING_URL: ${BILLING_URL:-http://host.docker.internal:8081}
      EXECUTION_URL: ${EXECUTION_URL:-http://host.docker.internal:8082}
      FUNCIONARIO_SEED_CPF: ${FUNCIONARIO_SEED_CPF:-}
      FUNCIONARIO_SEED_NOME: ${FUNCIONARIO_SEED_NOME:-}
      FUNCIONARIO_SEED_EMAIL: ${FUNCIONARIO_SEED_EMAIL:-}
      ENV: local
      PORT: 8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - oficina-net

  # ── Observabilidade (stretch, opcional) ────────────────────────────────
  # `docker compose --profile observability up` para incluir. Esboço mínimo:
  # Tempo recebe traces via OTLP diretamente (dispensa um Collector separado
  # pra esse escopo) e o Grafana já vem com Tempo pré-configurado como datasource.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: oficina-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
    profiles: ["observability"]
    networks:
      - oficina-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: oficina-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
    profiles: ["observability"]
    networks:
      - oficina-net

networks:
  oficina-net:

volumes:
  pgdata:
