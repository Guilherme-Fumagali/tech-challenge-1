version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: oficina-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/oficina
      DB_USER: oficina
      DB_PASS: oficina
      JWT_SECRET: minha-chave-jwt-segura-para-producao-minimo-32-chars
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
