services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: ${DB_USER:-oficina}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oficina}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oficina-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: oficina-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web
    networks:
      - oficina-net

  api:
    build: .
    container_name: oficina-api
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/oficina
      DB_USER: ${DB_USER:-oficina}
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: 8080
      NOTIFICACAO_CANAL: ${NOTIFICACAO_CANAL:-smtp}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-oficina@example.com}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - oficina-net

  # ── Observabilidade (stretch, opcional) ────────────────────────────────
  # `docker compose --profile observability up` para incluir. Esboço mínimo:
  # Tempo recebe traces via OTLP diretamente (dispensa um Collector separado
  # pra esse escopo) e o Grafana já vem com Tempo pré-configurado como datasource.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: oficina-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
    profiles: ["observability"]
    networks:
      - oficina-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: oficina-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
    profiles: ["observability"]
    networks:
      - oficina-net

networks:
  oficina-net:

volumes:
  pgdata:
